spring.application.name=apimonitoring

# ---------- Database ----------
# Defaults match the PostgreSQL started by `docker compose up -d db`.
# In other environments override them with environment variables.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/apimonitoring}
spring.datasource.username=${DB_USERNAME:apimonitoring}
spring.datasource.password=${DB_PASSWORD:apimonitoring}

# ---------- JPA / Flyway ----------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
# Timestamps are java.time.Instant + TIMESTAMP WITH TIME ZONE: always exchanged with the database in UTC,
# independent of the server's own time zone.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

# ---------- Security / JWT ----------
# The default secret is for local development only. In any shared or production environment
# set JWT_SECRET (Base64, at least 32 bytes), e.g. generated with: openssl rand -base64 48
security.jwt.secret=${JWT_SECRET:kZOE/0cgVefKHPzwCbS63cW0Spw+iGgFq4pteEYAF0c6qHFguQejPSGnpcQfOq9u}
security.jwt.expiration=${JWT_EXPIRATION:1h}
security.jwt.issuer=api-monitoring-system

# ---------- Monitoring ----------
monitoring.http.timeout=${MONITORING_HTTP_TIMEOUT:5s}
monitoring.scheduler.enabled=${MONITORING_SCHEDULER_ENABLED:true}

# ---------- Email notifications ----------
# Defaults point at Mailpit from docker-compose (SMTP on 1025, inbox UI on http://localhost:8025).
# For a real SMTP server also set SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD and
# SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true, SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# A mail server outage must not mark the whole app as DOWN in /actuator/health
# (that would make Docker / a load balancer restart or stop routing to a perfectly working app).
management.health.mail.enabled=false
monitoring.notifications.enabled=${NOTIFICATIONS_ENABLED:true}
monitoring.notifications.from=${MAIL_FROM:alerts@api-monitoring.local}
# Zone used to print times in emails (the API itself always returns UTC, e.g. "2026-11-17T13:15:21Z")
monitoring.notifications.time-zone=${NOTIFICATIONS_TIME_ZONE:Europe/Warsaw}

spring.application.name=apimonitoring

# ---------- Database ----------
# Defaults match the PostgreSQL started by `docker compose up -d db`.
# In other environments override them with environment variables.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/apimonitoring}
spring.datasource.username=${DB_USERNAME:apimonitoring}
spring.datasource.password=${DB_PASSWORD:apimonitoring}

# ---------- JPA / Flyway ----------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.flyway.enabled=true

# ---------- Security / JWT ----------
# The default secret is for local development only. In any shared or production environment
# set JWT_SECRET (Base64, at least 32 bytes), e.g. generated with: openssl rand -base64 48
security.jwt.secret=${JWT_SECRET:kZOE/0cgVefKHPzwCbS63cW0Spw+iGgFq4pteEYAF0c6qHFguQejPSGnpcQfOq9u}
security.jwt.expiration=${JWT_EXPIRATION:1h}
security.jwt.issuer=api-monitoring-system

# ---------- Monitoring ----------
monitoring.http.timeout=${MONITORING_HTTP_TIMEOUT:5s}
monitoring.scheduler.enabled=${MONITORING_SCHEDULER_ENABLED:true}
